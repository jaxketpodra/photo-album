<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的相册</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1 id="album-title">我们的相册</h1>
  <p id="album-desc">把值得记住的瞬间，一张一张留下来。</p>
</header>

<main class="masonry" id="masonry">
  <!-- 照片由 script.js 从 photos.json 渲染 -->
</main>

<footer class="site-footer">
  <p>© <span id="footer-year"></span> · 用照片记录生活 · <a href="how-to-upload.html">怎么传照片？</a></p>
</footer>

<!-- 大图浏览 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lb-close" aria-label="关闭">&times;</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">&#10094;</button>
  <figure class="lb-stage">
    <img id="lb-img" src="" alt="">
    <figcaption>
      <span class="lb-title" id="lb-title"></span>
      <span class="lb-caption" id="lb-caption"></span>
      <span class="lb-count" id="lb-count"></span>
    </figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lb-next" aria-label="下一张">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
