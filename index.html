<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的相册</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <button class="upload-btn" id="upload-btn" title="上传照片">＋ 上传照片</button>
  <h1 id="album-title">我们的相册</h1>
  <p id="album-desc">把值得记住的瞬间，一张一张留下来。</p>
</header>

<main class="masonry" id="masonry">
  <!-- 照片由 script.js 从 photos.json 渲染 -->
</main>

<footer class="site-footer">
  <p>© <span id="footer-year"></span> · 用照片记录生活 · <a href="how-to-upload.html">怎么传照片？</a></p>
</footer>

<!-- 大图浏览 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lb-close" aria-label="关闭">&times;</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">&#10094;</button>
  <figure class="lb-stage">
    <img id="lb-img" src="" alt="">
    <figcaption>
      <span class="lb-title" id="lb-title"></span>
      <span class="lb-caption" id="lb-caption"></span>
      <span class="lb-count" id="lb-count"></span>
    </figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lb-next" aria-label="下一张">&#10095;</button>
</div>

<!-- 上传弹窗 -->
<div class="upload-modal" id="upload-modal" aria-hidden="true">
  <div class="um-card">
    <button class="um-close" id="um-close" aria-label="关闭">&times;</button>
    <h3>📷 上传照片</h3>
    <div class="um-drop" id="um-drop">
      <p>点击选照片，或拖到这儿（可多选/多拖）</p>
      <p class="um-hint">JPG / PNG / WEBP / GIF，单张不超过 8MB，自动压缩</p>
      <input type="file" id="um-file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
    </div>
    <img class="um-preview" id="um-preview" alt="预览" hidden>
    <div class="um-list" id="um-list" hidden></div>
    <input class="um-input" id="um-title" type="text" maxlength="40" placeholder="照片标题（可选）">
    <input class="um-input" id="um-caption" type="text" maxlength="80" placeholder="想说的话（可选）">
    <input class="um-input" id="um-password" type="password" placeholder="上传口令（问相册主人要）">
    <button class="um-submit" id="um-submit">上传</button>
    <p class="um-status" id="um-status"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
